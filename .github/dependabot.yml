version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm-dev-dependencies:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /examples
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      examples-dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
