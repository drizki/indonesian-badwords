name: Validate package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Build release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pack from a clean checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"
          mv "$RUNNER_TEMP/npm-package/"*.tgz "$RUNNER_TEMP/npm-package/package.tgz"
      - name: Install example tooling
        run: npm ci --prefix examples
      - name: Verify docs against the release artifact
        run: npm run test:docs -- "$RUNNER_TEMP/npm-package/package.tgz"
      - name: Install the release artifact in examples
        shell: bash
        run: |
          rm -rf examples/node_modules/indonesian-badwords
          mkdir -p examples/node_modules/indonesian-badwords
          tar -xzf "$RUNNER_TEMP/npm-package/package.tgz" -C examples/node_modules/indonesian-badwords --strip-components=1
      - name: Type-check, test policy, and build all examples
        run: |
          npm run check --prefix examples
          npm run check:policy --prefix examples
          npm run build --prefix examples
      - name: Install the browser test runtime
        run: npx --prefix examples playwright install --with-deps chromium
      - name: Test all four browser apps
        run: npm run check:browser --prefix examples
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/package.tgz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  runtime:
    name: Node ${{ matrix.node }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Report test coverage
        if: matrix.node == 24
        run: npm run test:coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - name: Test the release artifact
        run: npm run test:package -- "$RUNNER_TEMP/npm-package/package.tgz"

  types:
    name: TypeScript ${{ matrix.typescript }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        typescript: ['5.9.3', '6.0.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the consumer compiler
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript }}
        run: npm install --no-save --ignore-scripts --no-audit --no-fund "typescript@$TYPESCRIPT_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - run: npm run test:package -- "$RUNNER_TEMP/npm-package/package.tgz"

  benchmark:
    name: Benchmark summary (informational)
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run the benchmark and write its JSON summary
        # Shared runners are too noisy for a speed gate: this records numbers, it does not judge them.
        # Correctness and size budgets are enforced by `npm test`.
        run: node scripts/benchmark.mjs --quick --json "$RUNNER_TEMP/benchmark-summary.json" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-summary
          path: ${{ runner.temp }}/benchmark-summary.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
