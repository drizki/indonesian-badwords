name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  benchmark:
    # Informational and deliberately outside validate.yml: publish.yml reuses validate.yml and gates a release on it, so a
    # timeout or a failed upload here must never be able to block publishing.
    name: Benchmark summary (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run the benchmark and write its JSON summary
        # Shared runners are too noisy for a speed gate: this records numbers, it does not judge them.
        # Correctness and size budgets are enforced by `npm test`.
        run: node scripts/benchmark.mjs --quick --json "$RUNNER_TEMP/benchmark-summary.json" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-summary
          path: ${{ runner.temp }}/benchmark-summary.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
